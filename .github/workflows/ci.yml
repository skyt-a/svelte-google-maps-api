name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check docs sync
        run: pnpm docs:sync:check

      - name: Run tests
        run: pnpm test

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Build packages and sites
        run: pnpm build
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'

      - name: Attach Storybook to docs
        run: pnpm docs:attach-storybook

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test docs and Storybook
        run: pnpm smoke:check
